databaseChangeLog:
  - changeSet:
      id: 1
      author: odschool
      changes:
        - createTable:
            tableName: school
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: school_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false